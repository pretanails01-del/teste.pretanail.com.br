    const themeBtn = document.getElementById('themeBtn');

    function updateIcon(theme){

      else{ themeIcon.className = 'fas fa-sun'; if(metaTheme) metaTheme.content = '#0a0a0a'; }
    }
    updateIcon(localStorage.getItem('preta-theme') || 'dark');
    themeBtn.addEventListener('click', ()=>{
      const current = localStorage.getItem('preta-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      localStorage.setItem('preta-theme', next);
      if(next === 'light'){ document.documentElement.setAttribute('data-theme','light'); }
      else{ document.documentElement.removeAttribute('data-theme'); }

    });
