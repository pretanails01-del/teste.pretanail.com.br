<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle ADM - Preta Nails</title>
<style>
:root { --primary: #C13584; }
body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #fff; text-align:center; }
.logo { width:100px; height:100px; border-radius:50%; border:3px solid var(--primary); margin:30px auto 10px; }
h1 { font-size: 28px; color: var(--primary); }
h1 span { color:#fff; }
.btn { display:block; width:90%; max-width:500px; margin:20px auto; padding: 18px; background: var(--primary); color:#fff; border-radius:12px; font-weight:800; border:none; font-size:16px; cursor:pointer; text-decoration:none; }
.login-box { width:90%; max-width:400px; margin:40px auto; padding:30px; background: rgba(255,255,255,0.05); border: 1px solid var(--primary); border-radius:20px; }
input { width:100%; padding:14px; margin:15px 0; background: #222; border:1px solid var(--primary); border-radius:10px; color:#fff; font-size:16px; }
.erro { color:#ff4d6d; display:none; }
#tela-painel { display:none; }
iframe { width:95%; height:70vh; border:2px solid var(--primary); border-radius:12px; margin:20px auto; }
</style>
</head>
<body>

  <img src="https://dl.dropboxusercontent.com/scl/fi/2adgfyuqpswr3czjicxcn/1783884486775_image_1783884486051.jpg?rlkey=96of3dejqt5w0b9m68tvo39mb&dl=1" class="logo">
  <h1>PRETA<span>NAILS</span></h1>

  <div id="tela-login">
    <div class="login-box">
      <h2>🔒 Painel ADM</h2>
      <input type="password" id="senha" placeholder="Senha: preta123">
      <div class="erro" id="erro">Senha incorreta!</div>
      <button onclick="entrar()" class="btn">ENTRAR</button>
    </div>
  </div>

  <div id="tela-painel">
    <button onclick="location.reload()" class="btn">🔄 ATUALIZAR AGENDAMENTOS</button>
    <iframe src="https://docs.google.com/spreadsheets/d/1QKKlPZCv90R5G7booDYEgE3kGbi8pN0db3wNLWGYnsA/pubhtml?gid=0&single=true&widget=true&headers=false"></iframe>
    <a href="agendamento.html" class="btn" style="background:#333">← VOLTAR</a>
  </div>

<script>
function entrar(){
  if(document.getElementById('senha').value === "preta123"){
    document.getElementById('tela-login').style.display = 'none';
    document.getElementById('tela-painel').style.display = 'block';
  } else {
    document.getElementById('erro').style.display = 'block';
  }
}
</script>
</body>
</html>
