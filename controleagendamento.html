<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel ADM - Preta Nails</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root { 
  --primary: #C13584; 
  --primary-dark: #8a1f5d; 
  --primary-neon: #ff4fb8;
  --bg: #020202; 
  --card: rgba(15,15,15,0.7); 
}
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  font-family: 'Inter', sans-serif; 
  background: #020202; 
  color: #fff; 
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

/* FUNDO UNHAS FLUTUANDO */
.nails-bg {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  z-index:-2;
  opacity:0.08;
  pointer-events:none;
}
.nail {
  position:absolute;
  width:60px; height:120px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-radius: 30px 30px 50% 50%;
  box-shadow: 0 0 20px rgba(193,53,132,0.3);
  animation: float 15s infinite ease-in-out;
}
@keyframes float {
  0%,100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-40px) rotate(10deg); }
}

/* EFEITO GLITCH NO TÍTULO */
.glitch {
  position:relative;
  display:inline-block;
}
.glitch::before,
.glitch::after {
  content: 'PRETANAILS';
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
}
.glitch::before {
  animation: glitch-1 2s infinite;
  color: #00ffff;
  z-index:-1;
}
.glitch::after {
  animation: glitch-2 2s infinite;
  color: #ff00ff;
  z-index:-2;
}
@keyframes glitch-1 {
 0%,100% { clip-path: inset(0 0 0 0); transform: translate(0); }
  20% { clip-path: inset(20% 0 30% 0); transform: translate(-2px, 2px); }
 40% { clip-path: inset(50% 0 20% 0); transform: translate(2px, -2px); }
}
@keyframes glitch-2 {
  0%,100% { clip-path: inset(0 0 0 0); transform: translate(0); }
 60% { clip-path: inset(10% 0 60% 0); transform: translate(2px, 2px); }
 80% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, -2px); }
}

.header { text-align:center; padding: 50px 20px 30px 20px; position:relative; z-index:1; }
.logo { 
  width:100px; 
  height:100px; 
  border-radius:50%; 
  border:3px solid var(--primary); 
  margin-bottom:15px; 
  object-fit:cover;
  box-shadow: 0 0 30px var(--primary);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 0 20px var(--primary); }
 50% { box-shadow: 0 0 40px var(--primary-neon); }
}
h1 { 
  font-family: 'Playfair Display', serif; 
  font-size: 36px; 
  color: var(--primary); 
  letter-spacing:3px;
  text-transform:uppercase;
}
h1 span { color:#fff; }
h2 { 
  text-align:center; 
  color:var(--primary); 
  margin:20px 0 15px 0; 
  font-family: 'Playfair Display', serif; 
  font-size:26px;
  text-shadow: 0 0 10px rgba(193,53,132,0.5);
}

/* BOTÕES NEON 3D */
.btn-adm { 
  display:flex; 
  align-items:center; 
  justify-content:center; 
  gap:12px; 
  width:90%; 
  max-width:500px; 
  margin:18px auto; 
  padding: 20px; 
  background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
  color:#fff; 
  text-align:center; 
  border-radius:16px; 
  font-weight:900; 
  border:2px solid transparent; 
  cursor:pointer; 
  text-decoration:none; 
  font-size:17px; 
  transition: all 0.3s; 
  box-shadow: 0 0 20px rgba(193,53,132,0.4);
  position:relative;
  overflow:hidden;
}
.btn-adm::before {
  content:'';
  position:absolute;
  top:0; left:-100%;
  width:100%; height:100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  transition: 0.5s;
}
.btn-adm:hover::before { left:100%; }
.btn-adm:hover { 
  transform: translateY(-3px) scale(1.02); 
  box-shadow: 0 0 40px var(--primary-neon);
  border-color: var(--primary-neon);
}
.btn-secundario { background: linear-gradient(135deg, #1a1a1a, #0a0a0a); }

/* LOGIN BOX VIDRO NEON */
.login-box { 
  width:90%; 
  max-width:440px; 
  margin:40px auto; 
  padding:45px 35px; 
  background: var(--card); 
  border: 2px solid rgba(193,53,132,0.5); 
  border-radius:24px; 
  backdrop-filter: blur(15px);
  box-shadow: 0 0 40px rgba(193,53,132,0.3);
  position:relative; z-index:1;
}
.login-box p { text-align:center; color:#ccc; margin-bottom:20px; font-size:15px; }
.login-box input { 
  width:100%; 
  padding:18px; 
  margin:18px 0; 
  background: rgba(0,0,0,0.6); 
  border:2px solid rgba(193,53,132,0.5); 
  border-radius:14px; 
  color:#fff; 
  font-size:16px; 
  outline:none;
  transition:0.3s;
}
.login-box input:focus { 
  border-color: var(--primary-neon); 
  box-shadow: 0 0 20px var(--primary);
}
.erro { 
  color:#ff4d6d; 
  display:none; 
  text-align:center; 
  margin:12px 0; 
  font-weight:700;
  text-shadow: 0 0 10px #ff4d6d;
}
#tela-painel { display:none; max-width:850px; margin:0 auto; padding:20px; position:relative; z-index:1; }
.info-box { 
  background: var(--card); 
  border:2px solid rgba(193,53,132,0.4); 
  border-radius:18px; 
  padding:30px; 
  margin:25px 0; 
  text-align:center;
  box-shadow: 0 0 30px rgba(193,53,132,0.2);
}
.info-box i { font-size:45px; color:var(--primary); margin-bottom:12px; }
</style>
</head>
<body>

<!-- UNHAS NO FUNDO -->
<div class="nails-bg">
  <div class="nail" style="top:10%; left:5%; animation-delay:0s;"></div>
  <div class="nail" style="top:20%; right:8%; animation-delay:2s;"></div>
  <div class="nail" style="bottom:15%; left:10%; animation-delay:4s;"></div>
  <div class="nail" style="bottom:25%; right:5%; animation-delay:1s;"></div>
  <div class="nail" style="top:50%; left:15%; animation-delay:3s;"></div>
  <div class="nail" style="top:60%; right:12%; animation-delay:5s;"></div>
</div>

  <div class="header">
    <img src="https://dl.dropboxusercontent.com/scl/fi/2adgfyuqpswr3czjicxcn/1783884486775_image_1783884486051.jpg?rlkey=96of3dejqt5w0b9m68tvo39mb&dl=1" class="logo" alt="Logo">
    <h1><span class="glitch">PRETA<span>NAILS</span></span></h1>
  </div>

  <div id="tela-login">
    <div class="login-box">
      <h2>🔒 Acesso Restrito</h2>
      <p>Painel Administrativo Premium</p>
      <input type="password" id="senha" placeholder="Digite a senha" onkeypress="if(event.key==='Enter')entrar()">
      <div class="erro" id="erro">Senha incorreta! Tente novamente.</div>
      <button onclick="entrar()" class="btn-adm"><i class="fa fa-fingerprint"></i> ENTRAR NO PAINEL</button>
    </div>
  </div>

  <div id="tela-painel">
    <h2>📊 Central de Agendamentos</h2>
    
    <div class="info-box">
      <i class="fa fa-file-excel"></i>
      <h3>Planilha Oficial</h3>
      <p>Todos os agendamentos ficam salvos aqui. Edite, adicione e exclua direto na planilha do Google.</p>
    </div>

    <a href="https://docs.google.com/spreadsheets/d/1QKKlPZCv90R5G7booDYEgE3kGbi8pN0db3wNLWGYnsA/edit#gid=0" target="_blank" class="btn-adm">
      <i class="fa fa-table"></i> ABRIR PLANILHA PARA EDITAR
    </a>

    <button onclick="location.reload()" class="btn-adm btn-secundario"><i class="fa fa-rotate"></i> SAIR DO PAINEL</button>
    <a href="agendamento.html" class="btn-adm btn-secundario"><i class="fa fa-arrow-left"></i> VOLTAR AO SITE</a>
  </div>

<script>
const SENHA_CORRETA = "72591324Beh@";

function entrar(){
  if(document.getElementById('senha').value === SENHA_CORRETA){
    document.getElementById('tela-login').style.display = 'none';
    document.getElementById('tela-painel').style.display = 'block';
    document.getElementById('erro').style.display = 'none';
  } else {
    document.getElementById('erro').style.display = 'block';
  }
}
</script>

</body>
</html>
