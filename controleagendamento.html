<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel ADM - Preta Nails</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root { --primary: #C13584; --primary-dark: #a02c6e; --bg: #0a0a0a; --card: rgba(255,255,255,0.04); }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', sans-serif; background: linear-gradient(180deg, #0a0a0a 0%, #050505 100%); color: #fff; min-height:100vh; }
.header { text-align:center; padding: 30px 20px 10px 20px; }
.logo { width:80px; height:80px; border-radius:50%; border:3px solid var(--primary); margin-bottom:10px; object-fit:cover; }
h1 { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--primary); letter-spacing:1px; }
h1 span { color:#fff; }
h2 { text-align:center; color:var(--primary); margin:20px 0 10px 0; font-family: 'Playfair Display', serif; font-size:24px; }
.btn-adm { display:flex; align-items:center; justify-content:center; gap:10px; width:90%; max-width:500px; margin:15px auto; padding: 16px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color:#fff; text-align:center; border-radius:14px; font-weight:800; border:none; cursor:pointer; text-decoration:none; font-size:15px; transition:0.3s; }
.btn-adm:hover { transform: translateY(-2px); }
.btn-secundario { background: #2a2a2a; }
.login-box { width:90%; max-width:420px; margin:40px auto; padding:40px 30px; background: var(--card); border: 1px solid rgba(193,53,132,0.3); border-radius:20px; backdrop-filter: blur(10px); }
.login-box p { text-align:center; color:#aaa; margin-bottom:20px; font-size:14px; }
.login-box input { width:100%; padding:16px; margin:15px 0; background: rgba(0,0,0,0.4); border:1px solid rgba(193,53,132,0.4); border-radius:12px; color:#fff; font-size:16px; outline:none; }
.erro { color:#ff4d6d; display:none; text-align:center; margin:10px 0; font-weight:600; }
#tela-painel { display:none; max-width:1200px; margin:0 auto; padding:20px; }
.sheet-wrap { width:100%; height:75vh; border:2px solid var(--primary); border-radius:16px; overflow:hidden; margin:20px 0; box-shadow: 0 10px 30px rgba(193,53,132,0.2); }
.sheet-wrap iframe { width:100%; height:100%; border:none; }
.info { text-align:center; color:#aaa; font-size:13px; margin-bottom:10px; }
</style>
</head>
<body>

  <div class="header">
    <img src="https://dl.dropboxusercontent.com/scl/fi/2adgfyuqpswr3czjicxcn/1783884486775_image_1783884486051.jpg?rlkey=96of3dejqt5w0b9m68tvo39mb&dl=1" class="logo" alt="Logo">
    <h1>PRETA<span>NAILS</span></h1>
  </div>

  <div id="tela-login">
    <div class="login-box">
      <h2>🔒 Acesso Restrito</h2>
      <p>Painel administrativo do sistema</p>
      <input type="password" id="senha" placeholder="Digite a senha" onkeypress="if(event.key==='Enter')entrar()">
      <div class="erro" id="erro">Senha incorreta! Tente novamente.</div>
      <button onclick="entrar()" class="btn-adm"><i class="fa fa-lock-open"></i> ENTRAR NO PAINEL</button>
    </div>
  </div>

  <div id="tela-painel">
    <h2>📊 Central de Agendamentos</h2>
    <p class="info">Edite direto na planilha abaixo. As alterações salvam automático.</p>
    
    <div class="sheet-wrap">
      <iframe src="https://docs.google.com/spreadsheets/d/1QKKlPZCv90R5G7booDYEgE3kGbi8pN0db3wNLWGYnsA/edit?gid=0&rm=embedded"></iframe>
    </div>

    <button onclick="location.reload()" class="btn-adm btn-secundario"><i class="fa fa-right-from-bracket"></i> SAIR DO PAINEL</button>
    <a href="agendamento.html" class="btn-adm btn-secundario"><i class="fa fa-arrow-left"></i> VOLTAR AO SITE</a>
  </div>

<script>
const SENHA_CORRETA = "preta123";

function entrar(){
  if(document.getElementById('senha').value === SENHA_CORRETA){
    document.getElementById('tela-login').style.display = 'none';
    document.getElementById('tela-painel').style.display = 'block';
    document.getElementById('erro').style.display = 'none';
  } else {
    document.getElementById('erro').style.display = 'block';
  }
}
</script>

</body>
</html>
