<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle ADM - Preta Nails</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root { --primary: #C13584; --primary-dark: #a02c6e; --text: #ffffff; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', sans-serif; background: linear-gradient(180deg, #0a0a0a 0%, #050505 100%); color: var(--text); }
.header { text-align:center; padding: 30px 20px 10px 20px; }
.logo { width:80px; height:80px; border-radius:50%; border:3px solid var(--primary); margin-bottom:10px; }
h1 { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--primary); }
h1 span { color:#fff; }
.btn-adm { display:block; width:90%; max-width:1200px; margin:20px auto; padding: 18px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color:#fff; text-align:center; border-radius:12px; font-weight:800; border:none; }
.login-box { width:90%; max-width:400px; margin:40px auto; padding:30px; background: rgba(255,255,255,0.04); border: 1px solid rgba(193,53,132,0.3); border-radius:20px; }
.login-box input { width:100%; padding:14px; margin:15px 0; background: rgba(0,0,0,0.3); border:1px solid rgba(193,53,132,0.4); border-radius:10px; color:#fff; }
.erro { color:#ff4d6d; display:none; }
#tela-painel { display:none; }
.tabela-wrap { width:95%; margin:20px auto; overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th { background:rgba(193,53,132,0.3); padding:8px; }
td { padding:8px; border-bottom:1px solid #333; }
</style>
</head>
<body>

  <div class="header">
    <img src="https://dl.dropboxusercontent.com/scl/fi/2adgfyuqpswr3czjicxcn/1783884486775_image_1783884486051.jpg?rlkey=96of3dejqt5w0b9m68tvo39mb&dl=1" class="logo">
    <h1>PRETA<span>NAILS</span></h1>
  </div>

  <div id="tela-login">
    <div class="login-box">
      <h2 style="text-align:center;">🔒 Painel ADM</h2>
      <input type="password" id="senha" placeholder="Senha: preta123">
      <div class="erro" id="erro">Senha incorreta!</div>
      <button onclick="entrar()" class="btn-adm">ENTRAR</button>
    </div>
  </div>

  <div id="tela-painel">
    <button onclick="carregarDados()" class="btn-adm">ATUALIZAR AGENDAMENTOS</button>
    <div class="tabela-wrap" id="tabela"></div>
    <a href="agendamento.html" class="btn-adm" style="background:#333">VOLTAR</a>
  </div>

<script>
const SENHA_CORRETA = "preta123";
const URL = "https://script.google.com/macros/s/AKfycbyM29ZonKM8NlWgkx1eg_PQ6pCpnKNv33pe_OClzBnHNr4jljnnh-lwdC1-ls1vLw/exec?action=ler";

function entrar(){
  if(document.getElementById('senha').value === SENHA_CORRETA){
    document.getElementById('tela-login').style.display = 'none';
    document.getElementById('tela-painel').style.display = 'block';
    carregarDados();
  } else {
    document.getElementById('erro').style.display = 'block';
  }
}

async function carregarDados(){
  document.getElementById('tabela').innerHTML = 'Carregando...';
  const res = await fetch(URL + '?action=ler');
  const dados = await res.json();
  let html = '<table><tr>';
  dados[0].forEach(col => { html += `<th>${col}</th>`; });
  html += '</tr>';
  dados.slice(1).forEach(linha => {
    html += '<tr>';
    linha.forEach(cel => { html += `<td>${cel || '-'}</td>`; });
    html += '</tr>';
  });
  html += '</table>';
  document.getElementById('tabela').innerHTML = html;
}
</script>

</body>
</html>
