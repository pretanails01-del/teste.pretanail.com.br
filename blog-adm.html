
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ADM Preta Nails - Blog</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--rosa:#ff2d92;--primary:#C13584;--dark:#0a0a0a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#0a0a0a;color:#fff;padding:20px}
.login{max-width:400px;margin:100px auto;background:#111;border:1px solid #C13584;padding:30px;border-radius:16px;text-align:center}
.login input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin-top:15px}
.login button{width:100%;margin-top:15px;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,#ff2d92,#C13584);color:#fff;font-weight:800;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:0 auto 20px}
.btn{padding:10px 18px;border-radius:50px;border:none;font-weight:800;cursor:pointer}
.btn-rosa{background:linear-gradient(135deg,#ff2d92,#C13584);color:#fff}
.btn-dark{background:#1a1a1a;border:1px solid #333;color:#fff}
.grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(193,53,132,0.18);border-radius:16px;padding:14px}
.card img{width:100%;height:160px;object-fit:cover;border-radius:12px;background:#000;display:block}
.card input,.card textarea{width:100%;margin-top:8px;padding:10px;border-radius:8px;border:1px solid #333;background:#000;color:#fff;font-size:12px}
.card textarea{height:60px;resize:none}
.card .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.upload{margin-top:8px;display:flex;gap:6px}
.upload input[type=file]{display:none}
.upload label{flex:1;background:#1a1a1a;border:1px dashed #C13584;padding:8px;border-radius:8px;text-align:center;font-size:11px;cursor:pointer}
.preview-tag{font-size:10px;color:#C13584;font-weight:800;margin-top:6px}
</style>
</head>
<body>

<div id="loginBox" class="login">
<h2><i class="fas fa-lock"></i> ADM Preta Nails</h2>
<p style="opacity:.6;font-size:12px;margin-top:6px">Digite a senha de dona</p>
<input type="password" id="senhaInput" placeholder="Senha">
<button onclick="entrar()">ENTRAR</button>
<p id="erro" style="color:#ff2d92;font-size:12px;margin-top:10px;display:none">Senha errada</p>
</div>

<div id="painel" style="display:none">
<div class="top">
<h2>BLOG ADM - 50 Matérias <span id="contador" style="color:#C13584"></span></h2>
<div style="display:flex;gap:8px">
<button class="btn btn-dark" onclick="carregarDoBlog()"><i class="fas fa-download"></i> CARREGAR DO BLOG.HTML</button>
<button class="btn btn-rosa" onclick="exportar()"><i class="fas fa-file-export"></i> EXPORTAR BLOG.HTML NOVO</button>
</div>
</div>
<div id="lista" class="grid"></div>
</div>

<script>
const SENHA = "72591324Beh@";
const STORAGE_KEY = "preta_blog_adm_v2";

// LOGIN
function entrar(){
  const v=document.getElementById('senhaInput').value;
  if(v===SENHA){
    sessionStorage.setItem('adminLiberado','true');
    localStorage.setItem('preta_blog_adm_auth','72591324Beh@');
    document.getElementById('loginBox').style.display='none';
    document.getElementById('painel').style.display='block';
    iniciar();
  } else {
    document.getElementById('erro').style.display='block';
  }
}
if(sessionStorage.getItem('adminLiberado')==='true' || localStorage.getItem('preta_blog_adm_auth')==='72591324Beh@'){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('painel').style.display='block';
}

// DADOS INICIAIS 50
const materiasBase=[
{id:"materia-01-jardim-peri",href:"alongamento-de-unhas-jardim-peri-sp.html",tag:"JARDIM PERI",titulo:"Como transformei unhas em autoestima no Jardim Peri",desc:"Minha história de vida e por que larguei tudo.",img:"https://dl.dropboxusercontent.com/scl/fi/e73mx5du83x9vnm4f94xg/1792340123273_image_1792340122736.jpg?rlkey=j4ry4t2twmmlx1ewhkablqj6p&dl=1"},
{id:"materia-02-santana",href:"alongamento-de-unhas-santana-sp.html",tag:"ALTA CONVERSÃO",titulo:"O dia que decidi viver só de unhas",desc:"Do zero ao studio lotado na Zona Norte.",img:"https://dl.dropboxusercontent.com/scl/fi/475wa0rn2ouqiuyg32zxp/1792340212449_image_1792340211565.jpg?rlkey=6vh6dcamgkwx8vmqpr8bkvco3&dl=1"},
{id:"materia-50-agendar-agora",href:"alongamento-de-unhas-agendar-agora.html",tag:"VAGA AGORA",titulo:"Quero garantir minha vaga agora - últimas dessa semana",desc:"Corre que lota.",img:"https://dl.dropboxusercontent.com/scl/fi/475wa0rn2ouqiuyg32zxp/1792340212449_image_1792340211565.jpg?rlkey=6vh6dcamgkwx8vmqpr8bkvco3&dl=1"}
];

let materias=[];

function iniciar(){
  const salvo=localStorage.getItem(STORAGE_KEY);
  materias=salvo?JSON.parse(salvo):materiasBase;
  // completa até 50 se faltar
  while(materias.length<50){
    const n=materias.length+1;
    materias.push({id:`materia-${n}`,href:`materia-${n}.html`,tag:`TAG ${n}`,titulo:`Matéria ${n} - Preta Nails`,desc:`Descrição da matéria ${n}`,img:''});
  }
  render();
}

function render(){
  const lista=document.getElementById('lista');
  lista.innerHTML='';
  materias.forEach((m,i)=>{
    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`
      <img id="img-${i}" src="${m.img}" onerror="this.src='https://via.placeholder.com/400x200/111/C13584?text=Sem+Foto'">
      <div class="preview-tag">${m.id} | ${m.href}</div>
      <input id="titulo-${i}" value="${m.titulo}" placeholder="Título">
      <textarea id="desc-${i}" placeholder="Descrição curta">${m.desc}</textarea>
      <div class="row">
        <input id="tag-${i}" value="${m.tag}" placeholder="TAG">
        <input id="href-${i}" value="${m.href}" placeholder="arquivo.html">
      </div>
      <input id="imgurl-${i}" value="${m.img}" placeholder="Link da foto Dropbox">
      <div class="upload">
        <label for="file-${i}"><i class="fas fa-image"></i> TROCAR FOTO DO CELULAR</label>
        <input type="file" id="file-${i}" accept="image/*" onchange="uploadFoto(${i}, this)">
      </div>
    `;
    lista.appendChild(div);
    // auto save on change
    ['titulo','desc','tag','href','imgurl'].forEach(campo=>{
      const el=div.querySelector(`#${campo}-${i}`);
      if(el) el.addEventListener('input', ()=>{ salvarCampos(i); });
    });
  });
  document.getElementById('contador').innerText=`${materias.length} matérias`;
}

function salvarCampos(i){
  materias[i].titulo=document.getElementById(`titulo-${i}`).value;
  materias[i].desc=document.getElementById(`desc-${i}`).value;
  materias[i].tag=document.getElementById(`tag-${i}`).value;
  materias[i].href=document.getElementById(`href-${i}`).value;
  materias[i].img=document.getElementById(`imgurl-${i}`).value;
  document.getElementById(`img-${i}`).src=materias[i].img;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(materias));
}

function uploadFoto(i, input){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    materias[i].img=e.target.result; // base64 temporário
    document.getElementById(`imgurl-${i}`).value=e.target.result;
    document.getElementById(`img-${i}`).src=e.target.result;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(materias));
    alert('Foto carregada! Quando exportar, lembre de trocar o base64 por link Dropbox pra não pesar o blog. Mas já funciona.');
  };
  reader.readAsDataURL(file);
}

function exportar(){
  // atualiza tudo
  materias.forEach((_,i)=>salvarCampos(i));
  
  let cardsHtml='';
  materias.forEach(m=>{
    cardsHtml+=`<a href="${m.href}" data-id="${m.id}" title="${m.titulo}" class="card"><div class="thumb"><img src="${m.img}" alt="${m.titulo}"><span class="tag">${m.tag}</span></div><div class="info"><h3>${m.titulo}</h3><p>${m.desc}</p><div class="cta">Ler matéria <i class="fas fa-arrow-right"></i></div></div></a>\n`;
  });

  const blogDadosJson=JSON.stringify({materias:materias.map(m=>({id:m.id,href:m.href,tag:m.tag})),versao:"2.0-foto",adsense_protegido:true},null,2);

  const novoBlog=`<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Preta Nails</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>/* seu CSS original aqui - mantém o mesmo */:root{--rosa:#ff2d92;--primary:#C13584;--dark:#0a0a0a;--card:rgba(255,255,255,0.04);--border:rgba(193,53,132,0.18)}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:var(--dark);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit}.thumb{height:160px;position:relative}.thumb img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;top:12px;left:12px;background:rgba(0,0,0,0.6);border:1px solid var(--primary);padding:5px 10px;border-radius:50px;font-size:9px}.info{padding:16px}.cta{color:var(--primary);font-size:11px;font-weight:800;margin-top:8px}</style>
<!-- ADSENSE-START --><!-- ADSENSE-END -->
</head>
<body>
<div class="grid">
${cardsHtml}
</div>
<script id="blog-dados" type="application/json">${blogDadosJson}<\/script>
<script>
(function(){
  const SENHA="72591324Beh@";
  const ua=navigator.userAgent.toLowerCase();
  const isBot=ua.includes('googlebot')||ua.includes('mediapartners-google')||ua.includes('adsbot-google');
  const isLocal=location.hostname==="localhost"||location.hostname==="127.0.0.1"||location.protocol==="file:";
  const isMobile=/Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const urlParams=new URLSearchParams(location.search);
  if(urlParams.get('admin')===SENHA) sessionStorage.setItem('adminLiberado','true');
  if(sessionStorage.getItem('adminLiberado')==='true'||isBot||isLocal||isMobile) return;
  let bloqueado=false;
  function trava(){ if(bloqueado) return; bloqueado=true; document.documentElement.innerHTML='<body style=margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#fff><div style=border:1px solid #C13584;padding:40px;border-radius:16px;background:#111><h2 style=color:#C13584>Preta Nails - Navegação Segura</h2><p style=margin-top:15px>Conteúdo protegido.</p><button onclick=location.reload() style=margin-top:20px;padding:12px 24px;background:#C13584;border:none;border-radius:8px;color:#fff>Voltar</button></div></body>';}
  document.addEventListener('keydown',e=>{ const k=e.key.toUpperCase(); if(e.ctrlKey&&k==='C') return; if(k==='F12'||(e.ctrlKey&&['U','S','P','I','J','A','F','H'].includes(k))||(e.ctrlKey&&e.shiftKey&&['I','J','C','K','M'].includes(k))){ e.preventDefault(); trava(); }},true);
  document.addEventListener('contextmenu',e=>{ e.preventDefault(); trava(); },true);
})();
<\/script>
</body>
</html>`;

  const blob=new Blob([novoBlog],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='blog.html'; a.click();
  URL.revokeObjectURL(url);
}

function carregarDoBlog(){
  alert('Abre seu blog.html atual e copia o conteúdo de <script id="blog-dados"> - por enquanto edita manual aqui. Na próxima versão já leio automático.');
}
</script>
</body>
</html>
